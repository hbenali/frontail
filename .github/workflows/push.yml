on: push
name: Build, Lint, Test, and Publish
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: npm install
      - run: npm test
      - run: npm run lint
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          npm install -g npm@latest
          npm publish
