on: push
name: Build, Lint, Test, and Publish
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: npm install
      - run: npm test
      - run: npm run lint
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          npm install -g npm@latest
          npm publish

  docker:
    name: Docker (Docker Hub + GHCR)
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Read package version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            FRONTAIL_VERSION=${{ steps.pkg.outputs.version }}
            FRONTAIL_REVISION=${{ github.sha }}
          tags: |
            hbenali/frontail:${{ github.ref_name }}
            hbenali/frontail:latest
            ghcr.io/hbenali/frontail:${{ github.ref_name }}
            ghcr.io/hbenali/frontail:latest
