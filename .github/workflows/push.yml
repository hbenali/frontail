on: push
name: Build, Lint, Test, and Publish
jobs:
  build:
    name: Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          registry-url: 'https://registry.npmjs.org'
      - run: npm install
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/') && matrix.node == 24
        run: |
          npm install -g npm@latest
          npm publish

  docker:
    name: Docker (Docker Hub + GHCR)
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read package version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: |
            FRONTAIL_VERSION=${{ steps.pkg.outputs.version }}
            FRONTAIL_REVISION=${{ github.sha }}
          tags: |
            hbenali/frontail:${{ github.ref_name }}
            hbenali/frontail:latest
            ghcr.io/hbenali/frontail:${{ github.ref_name }}
            ghcr.io/hbenali/frontail:latest

      - name: Attest build provenance (Docker Hub)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: docker.io/hbenali/frontail
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest build provenance (GHCR)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/hbenali/frontail
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Bump demo base image pin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout master
          sed -i -E "s#FROM hbenali/frontail:[^@]+@sha256:[0-9a-f]+#FROM hbenali/frontail:${{ github.ref_name }}@${{ steps.push.outputs.digest }}#" Dockerfile.demo
          git add Dockerfile.demo
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump demo base image pin to ${{ github.ref_name }}"
            git push origin master
          fi

  release-binaries:
    name: Binary Releases
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install
      - run: npm run pkg
      - name: Rename binaries
        run: |
          cd dist
          for f in frontail-*; do
            base="${f#frontail-}"
            mv "$f" "frontail-${{ github.ref_name }}-${base}"
          done
          ls -la
      # Published releases are immutable (assets can't be added afterwards),
      # so the release is created as a DRAFT with the binaries attached. A
      # maintainer then edits the notes and publishes it:
      #   gh release edit <tag> --notes-file notes.md --draft=false
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          files: dist/*
          generate_release_notes: true
