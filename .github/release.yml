# Groups GitHub's auto-generated release notes (workflow-created draft
# releases and "Generate release notes") by pull-request label.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Security
      labels: [security]
    - title: Features
      labels: [enhancement, feature]
    - title: Fixes
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
